name: nushell
target:
  registry: ocx.sh
  repository: nushell

source:
  type: github_release
  owner: nushell
  repo: nushell
  tag_pattern: "^(?P<version>\\d+\\.\\d+\\.\\d+)$"

# Pass 1 — Linux only. darwin/windows staged below for Pass 2/3.
assets:
  linux/amd64:
    # Static-pie musl build — portable across glibc + musl hosts. The gnu
    # tarball also ships but listing both is an ambiguous same-version match.
    - "^nu-.*-x86_64-unknown-linux-musl\\.tar\\.gz$"
  linux/arm64:
    - "^nu-.*-aarch64-unknown-linux-musl\\.tar\\.gz$"
  darwin/amd64:
    - "^nu-.*-x86_64-apple-darwin\\.tar\\.gz$"
  darwin/arm64:
    - "^nu-.*-aarch64-apple-darwin\\.tar\\.gz$"
  windows/amd64:
    # .zip only — the .msi is an installer, not a relocatable bundle.
    - "^nu-.*-x86_64-pc-windows-msvc\\.zip$"
  windows/arm64:
    - "^nu-.*-aarch64-pc-windows-msvc\\.zip$"

asset_type:
  # Unix tarballs wrap binaries in a versioned dir (nu-<v>-<target>/nu);
  # the Windows zips are flat (nu.exe at the archive root).
  default:
    type: archive
    strip_components: 1
  platforms:
    windows/amd64:
      type: archive
      strip_components: 0
    windows/arm64:
      type: archive
      strip_components: 0

metadata:
  default: metadata.json

skip_prereleases: true
cascade: true
build_timestamp: none

versions:
  min: "0.105.0"
  new_per_run: 5
  poll_interval: "0 */6 * * *"

verify:
  github_asset_digest: true

concurrency:
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

tests:
  - name: smoke
    script: tests/smoke.star

platforms:
  linux/amd64:
    runner: ubuntu-latest
  linux/arm64:
    runner: ubuntu-24.04-arm
  darwin/amd64:
    # Intel slice tested on the arm64 macos-14 runner via Rosetta 2 (GitHub's
    # macos-13 Intel pool is exhausted and deadlocks the push job).
    runner: macos-14
  darwin/arm64:
    runner: macos-14
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  windows/arm64:
    runner: windows-11-arm
    shell: pwsh

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
